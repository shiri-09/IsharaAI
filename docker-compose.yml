services:
  ishara:
    build: .
    ports:
      - "${ISHARA_PORT:-8080}:8000"
    env_file: .env
    environment:
      # reach Ollama running on the host machine
      OLLAMA_URL: http://host.docker.internal:11434
      DATABASE_URL: sqlite:////app/storage/ishara.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ishara-db:/app/storage

volumes:
  ishara-db:
